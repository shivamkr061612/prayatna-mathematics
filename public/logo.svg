<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer 3D Rim Gradient -->
    <radialGradient id="rimGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="innerBgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Text 3D Red Gradient -->
    <linearGradient id="prayTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="25%" stop-color="#e60000" />
      <stop offset="60%" stop-color="#b80000" />
      <stop offset="100%" stop-color="#700000" />
    </linearGradient>

    <!-- Metallic Highlight -->
    <linearGradient id="metalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Contact Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="20%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Top Arc Path for "DREAM • LEARN • ACHIEVE" -->
    <path id="topArcPath" d="M 90 220 A 185 185 0 0 1 410 220" fill="none" />
  </defs>

  <!-- ================= BASE LAYERS ================= -->
  <!-- Outer Cast Shadow -->
  <circle cx="250" cy="254" r="240" fill="#000000" opacity="0.2" filter="blur(8px)" />

  <!-- Outer Red 3D Rim -->
  <circle cx="250" cy="250" r="242" fill="url(#rimGrad)" stroke="#7f1d1d" stroke-width="3" />

  <!-- Black Dynamic Accent Swirls on Rim -->
  <!-- Top Left Swoosh -->
  <path d="M 55 150 C 70 80, 140 30, 230 18 C 170 35, 110 75, 75 140 Z" fill="#09090b" opacity="0.95" />
  <!-- Top Right Swoosh -->
  <path d="M 445 150 C 430 80, 360 30, 270 18 C 330 35, 390 75, 425 140 Z" fill="#09090b" opacity="0.95" />
  <!-- Bottom Left Swoosh -->
  <path d="M 30 280 C 20 360, 80 440, 170 475 C 110 445, 60 380, 45 300 Z" fill="#09090b" opacity="0.95" />
  <!-- Bottom Right Swoosh -->
  <path d="M 470 280 C 480 360, 420 440, 330 475 C 390 445, 440 380, 455 300 Z" fill="#09090b" opacity="0.95" />

  <!-- Inner Black Arch Banner for Motto -->
  <path d="M 70 230 A 195 195 0 0 1 430 230 L 412 230 A 176 176 0 0 0 88 230 Z" fill="#111827" />

  <!-- Inner Core Background -->
  <circle cx="250" cy="250" r="218" fill="url(#innerBgGrad)" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Curved Motto Ribbon Text: DREAM • LEARN • ACHIEVE -->
  <path d="M 98 215 A 178 178 0 0 1 402 215" id="arcMotto" fill="none" />
  <text fill="#ffffff" font-size="16" font-family="'Arial Black', Impact, sans-serif" font-weight="900" letter-spacing="4.5">
    <textPath href="#arcMotto" startOffset="50%" text-anchor="middle">
      DREAM &#160; <tspan fill="#ef4444" font-size="18">&#8226;</tspan> &#160; LEARN &#160; <tspan fill="#ef4444" font-size="18">&#8226;</tspan> &#160; ACHIEVE
    </textPath>
  </text>

  <!-- ================= TOP SECTION: MATH & CAP & BOOK ================= -->
  <g id="topIllustration" transform="translate(0, 10)">
    <!-- LEFT SIDE: Cartesian Coordinate Graph with curve -->
    <g transform="translate(90, 85)" id="coordinateGraph">
      <!-- Axes -->
      <line x1="25" y1="75" x2="25" y2="10" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="25,5 21,14 29,14" fill="#dc2626" />
      <text x="32" y="16" fill="#dc2626" font-size="15" font-weight="bold" font-family="'Times New Roman', serif" font-style="italic">y</text>

      <line x1="25" y1="75" x2="90" y2="75" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="95,75 86,71 86,79" fill="#dc2626" />
      <text x="88" y="68" fill="#dc2626" font-size="15" font-weight="bold" font-family="'Times New Roman', serif" font-style="italic">x</text>

      <!-- Smooth Exponential Math Curve -->
      <path d="M 28 73 Q 50 68 62 48 T 85 15" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- RIGHT SIDE: Drafting Compass and Pi Symbol -->
    <g transform="translate(340, 85)" id="compassAndPi">
      <!-- Compass / Divider Tool -->
      <g transform="translate(0, 0)">
        <!-- Top hinge circle -->
        <circle cx="26" cy="14" r="6" fill="#09090b" stroke="#dc2626" stroke-width="2" />
        <circle cx="26" cy="14" r="2.5" fill="#dc2626" />
        <!-- Horizontal stabilizer bar -->
        <line x1="16" y1="46" x2="36" y2="46" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
        <!-- Left Leg -->
        <line x1="24" y1="18" x2="8" y2="72" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" />
        <line x1="8" y1="72" x2="4" y2="82" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
        <!-- Right Leg -->
        <line x1="28" y1="18" x2="44" y2="72" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" />
        <line x1="44" y1="72" x2="48" y2="82" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Greek Letter Pi (π) -->
      <text x="50" y="76" fill="#dc2626" font-size="34" font-weight="bold" font-family="'Times New Roman', 'Cambria Math', Georgia, serif">π</text>
    </g>

    <!-- CENTER: OPEN BOOK WITH RED ACCENTS -->
    <g transform="translate(250, 155)" id="openBook">
      <!-- Book Back Cover Depth -->
      <path d="M -105 18 Q -50 -5 0 10 Q 50 -5 105 18 L 115 32 Q 55 5 0 22 Q -55 5 -115 32 Z" fill="#7f1d1d" />

      <!-- Left Page Wings (Red and White Pages) -->
      <path d="M 0 14 Q -50 -8 -108 12 L -104 22 Q -48 2 0 20 Z" fill="#dc2626" />
      <path d="M 0 10 Q -50 -12 -106 7 L -103 14 Q -48 -4 0 16 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75" />
      <path d="M 0 6 Q -50 -16 -103 2 L -100 8 Q -48 -9 0 13 Z" fill="#ffffff" />
      
      <!-- Right Page Wings (Red and White Pages) -->
      <path d="M 0 14 Q 50 -8 108 12 L 104 22 Q 48 2 0 20 Z" fill="#dc2626" />
      <path d="M 0 10 Q 50 -12 106 7 L 103 14 Q 48 -4 0 16 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75" />
      <path d="M 0 6 Q 50 -16 103 2 L 100 8 Q 48 -9 0 13 Z" fill="#ffffff" />

      <!-- Book Spine Center Fold -->
      <line x1="0" y1="5" x2="0" y2="24" stroke="#dc2626" stroke-width="2" />
    </g>

    <!-- CENTER: 3D GRADUATION MORTARBOARD CAP -->
    <g transform="translate(250, 105)" id="graduationCap" filter="url(#dropShadow)">
      <!-- Cap Skullcap base -->
      <path d="M -36 10 C -36 34, 36 34, 36 10 C 26 24, -26 24, -36 10 Z" fill="#18181b" />
      <ellipse cx="0" cy="18" rx="28" ry="8" fill="#09090b" opacity="0.8" />

      <!-- Top Diamond Cap Surface -->
      <polygon points="0,-36 94,-5 0,26 -94,-5" fill="#1c1917" stroke="#27272a" stroke-width="1.5" />
      <!-- Top Diamond Facet Highlight (Gloss) -->
      <polygon points="0,-36 94,-5 0,-8 -65,-22" fill="#3f3f46" opacity="0.6" />
      <polygon points="0,26 -94,-5 0,-8" fill="#09090b" opacity="0.6" />

      <!-- Mortarboard Center Button -->
      <circle cx="0" cy="-6" r="4.5" fill="#09090b" stroke="#71717a" stroke-width="1" />

      <!-- Red Tassel Cord -->
      <path d="M 0 -6 Q 38 -10 52 14" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
      <!-- Tassel Golden/Red Ring -->
      <circle cx="53" cy="18" r="3.5" fill="#f59e0b" />
      <!-- Tassel Fringe Brush -->
      <path d="M 50 20 L 56 20 L 60 40 L 48 40 Z" fill="#dc2626" />
      <line x1="50" y1="20" x2="48" y2="40" stroke="#991b1b" stroke-width="1" />
      <line x1="56" y1="20" x2="60" y2="40" stroke="#ef4444" stroke-width="1" />
    </g>
  </g>

  <!-- ================= CENTER SECTION: PRAYATNA ================= -->
  <g id="centerPrayatna" transform="translate(250, 248)">
    <!-- 3D Black Outline & Drop Shadow for PRAYATNA -->
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-size="76" font-weight="900" letter-spacing="1" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round" opacity="0.9">PRAYATNA</text>
    <text x="0" y="-3" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-size="76" font-weight="900" letter-spacing="1" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">PRAYATNA</text>
    <!-- Deep Red Front Face -->
    <text x="0" y="-3" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-size="76" font-weight="900" letter-spacing="1" fill="url(#prayTextGrad)">PRAYATNA</text>

    <!-- Top Metallic Bevel Highlight line on letters -->
    <path d="M -180 -18 L 180 -18" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- ================= MATHEMATICS BADGE ================= -->
  <g id="mathematicsBadge" transform="translate(250, 282)">
    <!-- Outer Red Stadium Frame -->
    <rect x="-182" y="-18" width="364" height="36" rx="18" fill="#dc2626" />
    <!-- Inner Deep Black Pill -->
    <rect x="-178" y="-15" width="356" height="30" rx="15" fill="#09090b" stroke="#dc2626" stroke-width="1.5" />

    <!-- Left Horizontal Accent Stripes -->
    <line x1="-165" y1="-5" x2="-140" y2="-5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-170" y1="0" x2="-136" y2="0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-165" y1="5" x2="-140" y2="5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Horizontal Accent Stripes -->
    <line x1="140" y1="-5" x2="165" y2="-5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <line x1="136" y1="0" x2="170" y2="0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <line x1="140" y1="5" x2="165" y2="5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />

    <!-- Text: MATHEMATICS -->
    <text x="0" y="7" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#ffffff" letter-spacing="4">MATHEMATICS</text>
  </g>

  <!-- ================= LOWER SECTION ================= -->
  <g id="lowerDetails" transform="translate(250, 332)">
    <!-- 11th & 12th  |  JEE  |  CUET  |  NDA -->
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-size="19" font-weight="900" fill="#09090b">
      11<tspan font-size="14" dy="-4">th</tspan><tspan font-size="19" dy="4"> &amp; 12</tspan><tspan font-size="14" dy="-4">th</tspan><tspan font-size="19" dy="4"> </tspan>
      <tspan fill="#dc2626" font-weight="bold"> | </tspan>
      JEE
      <tspan fill="#dc2626" font-weight="bold"> | </tspan>
      CUET
      <tspan fill="#dc2626" font-weight="bold"> | </tspan>
      NDA
    </text>

    <!-- Tagline: "Build Your Future With Us" -->
    <g transform="translate(0, 30)">
      <text x="-4" y="0" text-anchor="end" font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', cursive, serif" font-size="23" font-weight="bold" font-style="italic" fill="#09090b">
        Build Your Future
      </text>
      <text x="4" y="0" text-anchor="start" font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', cursive, serif" font-size="24" font-weight="bold" font-style="italic" fill="#dc2626">
        With Us
      </text>
    </g>

    <!-- Mobile Number Button Pill -->
    <g transform="translate(0, 56)" filter="url(#softShadow)">
      <!-- Red Pill Background -->
      <rect x="-132" y="-17" width="264" height="34" rx="17" fill="url(#pillGrad)" stroke="#7f1d1d" stroke-width="1.5" />
      
      <!-- Inner Dark Pill for phone number -->
      <rect x="-42" y="-13" width="168" height="26" rx="13" fill="#09090b" />

      <!-- White Phone Icon in Red Circle -->
      <circle cx="-110" cy="0" r="11" fill="#ffffff" />
      <g transform="translate(-115, -5)">
        <path d="M 2 1 C 1 1 0 2 0 3 C 0 8 4 12 9 12 C 10 12 11 11 11 10 L 9 7 C 8.5 6.5 7.8 6.5 7.3 7 L 6.5 7.8 C 5 7 4 6 3.2 4.5 L 4 3.7 C 4.5 3.2 4.5 2.5 4 2 Z" fill="#dc2626" />
      </g>

      <!-- Text: Mob: 7764026748 -->
      <text x="-80" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Mob:</text>
      <text x="42" y="5" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">7764026748</text>
    </g>

    <!-- Address & Location Pin -->
    <g transform="translate(0, 93)">
      <!-- Left decorative dash line -->
      <line x1="-115" y1="-3" x2="-75" y2="-3" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />

      <!-- Red Map Pin Icon -->
      <g transform="translate(-56, -12)">
        <path d="M 7 0 C 3.1 0 0 3.1 0 7 C 0 12.2 7 19 7 19 C 7 19 14 12.2 14 7 C 14 3.1 10.9 0 7 0 Z" fill="#dc2626" />
        <circle cx="7" cy="6.5" r="2.8" fill="#ffffff" />
      </g>

      <!-- Address Text -->
      <text x="-36" y="-6" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="12.5" font-weight="900" fill="#09090b">Madnani Lane</text>
      <text x="-36" y="6" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="12.5" font-weight="900" fill="#09090b">Mithanpura</text>
      <text x="-36" y="18" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="12.5" font-weight="900" fill="#09090b">Muz.</text>

      <!-- Right decorative dash line -->
      <line x1="75" y1="-3" x2="115" y2="-3" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
